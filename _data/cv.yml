              {
                "bullet": "**What Happens When the Party Decides? The Effect of Party Control of Primary Elections**\n\nUsing a large data set of contribution history to identify party-favorite candidates and employing a regression discontinuity design, I conduct a causal investigation into how party-supported candidates perform after they win the primary election. I find little evidence for candidates who receive support from parties in the primary doing any better in general elections compared to candidates who receive no support.",
              },
              {
                "bullet": "**Primed for Success: Party Elite Endorsement Efficacy in Open-Seat U.S. House Primary Elections**\n\nI assemble a comprehensive data set of all endorsements made in open-seat primary elections for the U.S. House in the 2024 election. Using Wikipedia page views to assess partisan elite influence I examine if endorsements from more influential elites translate into higher vote share.",
